name: bench
# Submits a full board for koota and baseline-js to benchbox. Does not wait for results.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHBOX_TOKEN: ${{ secrets.BENCHBOX_TOKEN }}
      BENCHBOX_REPO_TOKEN: ${{ secrets.BENCHBOX_REPO_TOKEN }}
      READY: ${{ secrets.BENCHBOX_TOKEN != '' && secrets.BENCHBOX_REPO_TOKEN != '' }}
      BENCHBOX_URL: ${{ vars.BENCHBOX_URL || 'https://bench-staging.benchbox.app' }}
    steps:
      - name: Check the secrets
        if: ${{ env.READY != 'true' }}
        run: echo "::notice::BENCHBOX_TOKEN or BENCHBOX_REPO_TOKEN is not set. Skipping the benchbox submit."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ env.READY == 'true' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ env.READY == 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ env.READY == 'true' }}
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.READY == 'true' }}
      # benchbox is private and has no published CLI. Check out the canary ref with a read-only token and put a `benchbox` launcher on PATH.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ env.READY == 'true' }}
        with:
          repository: jerzakm/benchbox
          ref: canary
          token: ${{ secrets.BENCHBOX_REPO_TOKEN }}
          path: benchbox-src
      - name: Install the benchbox CLI
        if: ${{ env.READY == 'true' }}
        run: |
          pnpm --dir "$GITHUB_WORKSPACE/benchbox-src" install --frozen-lockfile --filter @benchbox/cli...
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s/packages/cli/bin/benchbox.mjs" "$@"\n' "$GITHUB_WORKSPACE/benchbox-src" > "$RUNNER_TEMP/bin/benchbox"
          chmod +x "$RUNNER_TEMP/bin/benchbox"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and submit
        if: ${{ env.READY == 'true' }}
        run: pnpm bench:submit koota baseline-js
