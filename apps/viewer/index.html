<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ecs-arena viewer</title>
    <style>
      :root { --bg: #0d1117; --panel: rgba(22, 27, 34, 0.88); --line: #30363d; --text: #d0d7de; --dim: #8b949e; --blue: #4c9aff; --red: #ff6b6b }
      * { box-sizing: border-box }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
      .bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px) }
      .bar .grow { flex: 1 }
      .bar a { color: var(--blue); text-decoration: none }
      .bar a:hover { text-decoration: underline }
      select, button { background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer }
      button:hover, select:hover { border-color: var(--dim) }
      button.on { background: #1f6feb; border-color: #1f6feb; color: #fff }
      .group { display: flex }
      .group button { border-radius: 0; margin-left: -1px }
      .group button:first-child { border-radius: 6px 0 0 6px; margin-left: 0 }
      .group button:last-child { border-radius: 0 6px 6px 0 }
      .hud { position: fixed; top: 52px; left: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; line-height: 1.6; font-variant-numeric: tabular-nums; min-width: 190px }
      .hud .t0 { color: var(--blue) }
      .hud .t1 { color: var(--red) }
      .hud .dim { color: var(--dim) }
      #banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 22px; border-radius: 8px; font-size: 18px; font-weight: 600; background: var(--panel); border: 1px solid var(--line); display: none }
      #mini { position: fixed; right: 10px; bottom: 10px; width: 180px; height: 180px; border: 1px solid var(--line); border-radius: 8px; background: #0b140d; cursor: crosshair }
      .help { position: fixed; left: 10px; bottom: 10px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 420px; line-height: 1.5 }
      #err { color: var(--red) }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="bar">
      <select id="impl" title="implementation"></select>
      <select id="scenario" title="scenario"></select>
      <button id="play">Pause</button>
      <button id="restart">Restart</button>
      <div class="group" id="speed">
        <button data-speed="1x" class="on">1x</button>
        <button data-speed="4x">4x</button>
        <button data-speed="max">max</button>
      </div>
      <span class="grow"></span>
      <span id="stat" class="dim"></span>
      <a href="https://github.com/jerzakm/ecs-arena#readme" target="_blank" rel="noreferrer">results</a>
    </div>
    <div class="hud">
      <div>Tick <b id="tick">0</b></div>
      <div>Alive <span class="t0" id="alive0">0</span> / <span class="t1" id="alive1">0</span></div>
      <div>Kills <span class="t0" id="kills0">0</span> / <span class="t1" id="kills1">0</span></div>
      <div>Shrines <span class="t0" id="shrines0">0</span> / <span class="t1" id="shrines1">0</span></div>
      <div id="err"></div>
    </div>
    <div id="banner"></div>
    <canvas id="mini" width="180" height="180"></canvas>
    <div class="help">WASD or screen edge: pan. Wheel: zoom. Right-drag: grab and pan. Middle-drag or Q/E: rotate. F: reset view.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
